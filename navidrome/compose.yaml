services:
  navidrome:
    image: deluan/navidrome:0.64.2
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./music
        target: /music
        read_only: true
        bind:
          create_host_path: false

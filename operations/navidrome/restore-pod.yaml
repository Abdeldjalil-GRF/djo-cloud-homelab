apiVersion: v1
kind: Pod
metadata:
  name: navidrome-restore
  namespace: music
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: restore
      image: alpine:3.24.2
      command: ["sleep", "86400"]
      volumeMounts:
        - name: data
          mountPath: /restore-data
        - name: music
          mountPath: /restore-music
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: navidrome-data
    - name: music
      persistentVolumeClaim:
        claimName: navidrome-music

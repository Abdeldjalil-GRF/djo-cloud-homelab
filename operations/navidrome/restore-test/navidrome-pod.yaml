apiVersion: v1
kind: Pod
metadata:
  name: navidrome-test
  namespace: music-restore-test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: navidrome
      image: deluan/navidrome:0.64.2
      ports:
        - name: http
          containerPort: 4533
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
      startupProbe:
        httpGet:
          path: /ping
          port: http
        periodSeconds: 5
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /ping
          port: http
        periodSeconds: 10
      volumeMounts:
        - name: data
          mountPath: /data
        - name: music
          mountPath: /music
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: navidrome-data
    - name: music
      persistentVolumeClaim:
        claimName: navidrome-music

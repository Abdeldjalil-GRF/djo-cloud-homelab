apiVersion: v1
kind: Namespace
metadata:
  name: lab-network
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: lab-network
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  nodeSelector:
    kubernetes.io/hostname: djo-k3s-worker-01

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  containers:
    - name: client
      image: alpine:3.24.2
      command: ["sleep", "86400"]

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
